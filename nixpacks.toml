# Nixpacks build configuration for Railway deployment.
#
# The worker now uses Node.js exclusively (Readability.js for article
# extraction, epub-gen-memory for EPUB generation). No JDK required.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install", "npm install --prefix worker"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
